# Excepciones de Trivy SOLO para la imagen oficial de MySQL (mysql:8.4.13).
# Las usa únicamente el paso 'Scan MySQL image' de .github/workflows/deploy-azure.yml.
# Análisis completo: security/trivy/README.md. Vencen el 2027-02-16: reevaluar o actualizar la imagen.
vulnerabilities:
  - id: CVE-2025-61726
    paths:
      - usr/local/bin/gosu
    expired_at: 2027-02-16
    statement: >-
      gosu (Go stdlib) solo se ejecuta al arrancar el contenedor para pasar de root al usuario mysql y luego hace exec de mysqld; no abre conexiones de red, TLS, HTTP ni procesa entradas externas, así que estas rutas de código de la biblioteca estándar de Go no son alcanzables. Sin imagen oficial corregida a la fecha.
