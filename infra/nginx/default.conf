limit_req_zone $binary_remote_addr zone=securedocs_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=securedocs_auth:10m rate=10r/m;

upstream securedocs_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream securedocs_backend {
    server backend:4000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 11m;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=securedocs_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://securedocs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=securedocs_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://securedocs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://securedocs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
