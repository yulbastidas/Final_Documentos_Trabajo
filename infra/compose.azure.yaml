# Producción Azure: solo Nginx publica puertos. La VM ejecuta Docker Compose;
# MySQL y los documentos persisten en volúmenes del disco administrado (cifrado en reposo).
# Los registros usan json-file con rotación (configurado en /etc/docker/daemon.json).
services:
  storage-init:
    image: ${BACKEND_IMAGE:?Definir BACKEND_IMAGE}

  migrate:
    image: ${BACKEND_IMAGE:?Definir BACKEND_IMAGE}

  mysql:
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Definir BACKEND_IMAGE}
    build: !reset null
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'true'
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}

  frontend:
    image: ${FRONTEND_IMAGE:?Definir FRONTEND_IMAGE}
    build: !reset null

  nginx:
    # Imagen oficial + parches de Alpine (infra/docker/nginx.Dockerfile), publicada en ACR.
    image: ${NGINX_IMAGE:?Definir NGINX_IMAGE}
    environment:
      DEMO_BLOCK: |
        location = /dashboard { return 404; }
        location ^~ /dashboard/ { return 404; }
    ports: !override
      - '80:8080'
      - '443:8443'
